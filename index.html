<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="วันนี้ — พื้นที่เล็ก ๆ สำหรับจัดการสิ่งที่อยากทำ ทีละงาน ในจังหวะของคุณ" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;450;500;600;650;700&display=swap" rel="stylesheet" />
    <title>วันนี้ — ทีละงาน ในจังหวะของคุณ</title>
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem('wannee-theme'));
        document.documentElement.classList.toggle('dark', theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches));
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
